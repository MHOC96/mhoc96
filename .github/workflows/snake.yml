name: Generate Snake

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MHOC96
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Update assets and push
        run: |
          cp dist/github-contribution-grid-snake.svg assets/
          cp dist/github-contribution-grid-snake-dark.svg assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "Update contribution snake SVGs [bot]"
          git push
